services:
  treegen:
    build: .
    image: treegen:latest
    ports:
      - "8530:8530"
    environment:
      TREEGEN_ENV: production
      TREEGEN_HOST: 0.0.0.0
      TREEGEN_PORT: "8530"
      # Subcaminho no proxy (ex.: https://tool.betoschneider.com/treegen)
      TREEGEN_ROOT_PATH: "/treegen"
      TREEGEN_REQUEST_TIMEOUT: "2"
      TREEGEN_MAX_BODY_BYTES: "65536"
      TREEGEN_RATE_LIMIT: "120"
      TREEGEN_RATE_BURST: "20"
      TREEGEN_RATE_WINDOW: "60"
      TREEGEN_LIMIT_CONCURRENCY: "32"
      TREEGEN_LIMIT_MAX_REQUESTS: "10000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    restart: unless-stopped
